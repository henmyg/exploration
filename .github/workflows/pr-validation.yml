name: PR Validation

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'Maui/**'
      - '**.cs'
      - '**.csproj'
      - '.github/workflows/pr-validation.yml'

jobs:
  core-tests:
    name: Run Core Unit Tests (Linux)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore Maui/Maui.Infrastructure/Maui.Infrastructure.csproj
        dotnet restore Maui/Maui.Core/Maui.Core.csproj

    - name: Build Maui.Infrastructure
      run: dotnet build Maui/Maui.Infrastructure/Maui.Infrastructure.csproj --configuration Release --no-restore

    - name: Build Maui.Core
      run: dotnet build Maui/Maui.Core/Maui.Core.csproj --configuration Release --no-restore

    - name: Run tests (Linux - fast!)
      run: dotnet test Maui/Maui.Tests/Maui.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

  analyzer-build:
    name: Build Roslyn Analyzer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore analyzer dependencies
      run: dotnet restore Maui/Maui.Analyzers/Maui.Analyzers.csproj

    - name: Build analyzer
      run: dotnet build Maui/Maui.Analyzers/Maui.Analyzers.csproj --configuration Release --no-restore

    - name: Verify analyzer package
      run: |
        if [ ! -f Maui/Maui.Analyzers/bin/Release/netstandard2.0/Maui.Analyzers.dll ]; then
          echo "Error: Analyzer DLL not found"
          exit 1
        fi
        echo "Analyzer built successfully"

  analyzer-validation:
    name: Validate Code with Analyzer (Linux)
    runs-on: ubuntu-latest
    needs: analyzer-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore Maui/Maui.Infrastructure/Maui.Infrastructure.csproj
        dotnet restore Maui/Maui.Core/Maui.Core.csproj

    - name: Build Maui.Infrastructure with analyzer
      run: |
        echo "Building Maui.Infrastructure project with Roslyn analyzer enabled..."
        dotnet build Maui/Maui.Infrastructure/Maui.Infrastructure.csproj --configuration Release --no-restore > infra-output.log 2>&1

        # Check for MAUI001 warnings
        if grep -q "MAUI001" infra-output.log; then
          echo "::warning::Infrastructure code contains methods that should be extracted to static operations classes"
          grep "MAUI001" infra-output.log | while read -r line; do
            echo "::warning::$line"
          done
        else
          echo "No analyzer warnings found in Infrastructure - code looks good!"
        fi

        # Show full build output
        cat infra-output.log

    - name: Build Maui.Core with analyzer
      run: |
        echo "Building Maui.Core project with Roslyn analyzer enabled..."
        dotnet build Maui/Maui.Core/Maui.Core.csproj --configuration Release --no-restore > core-output.log 2>&1

        # Check for MAUI001 warnings
        if grep -q "MAUI001" core-output.log; then
          echo "::warning::Core code contains methods that should be extracted to static operations classes"
          grep "MAUI001" core-output.log | while read -r line; do
            echo "::warning::$line"
          done
        else
          echo "No analyzer warnings found in Core - code looks good!"
        fi

        # Show full build output
        cat core-output.log
